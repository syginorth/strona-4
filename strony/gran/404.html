<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zgubiony szlak · Grań</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2317251E'/%3E%3Cpolygon points='3,25 11,12 15,18 21,7 29,25' fill='%23FCFBF8'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500&display=swap">
<style>
:root { --ink:#17251E; --ink-hover:#2B3D33; --canvas:#FCFBF8; --mgla:#EFEDE6; --mute:#646A63; --czerwony:#D2321E; --ease:cubic-bezier(0.22,1,0.36,1); color-scheme: light; }
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--canvas);color:var(--ink);font-family:"Inter","Helvetica Neue",Arial,sans-serif;
  padding:48px max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px))}
main{max-width:680px;display:flex;flex-direction:column;gap:18px;align-items:flex-start}
.marker{display:grid;grid-template-rows:1fr 1fr 1fr;width:30px;height:21px;box-shadow:0 0 0 1px rgba(23,37,30,.12)}
.marker::before,.marker::after{content:"";background:#fff}.marker i{background:var(--czerwony)}
h1{margin:0;font-family:"Anton",Impact,sans-serif;font-weight:400;font-size:clamp(48px,12vw,96px);line-height:.9;text-transform:uppercase}
p{margin:0;font-size:16px;line-height:1.5;color:var(--mute);text-wrap:pretty}
a.btn{display:inline-flex;align-items:center;min-height:48px;padding:12px 30px;border-radius:30px;background:var(--ink);color:#fff;text-decoration:none;font-weight:500;transition:background-color 300ms var(--ease),transform 300ms var(--ease)}
a.btn:hover{background:var(--ink-hover)} a.btn:active{transform:scale(.97)} a:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
</style>
</head>
<body>
<main>
  <span class="marker" aria-hidden="true"><i></i></span>
  <h1>Zgubiony<br>szlak</h1>
  <p>Tej strony nie ma. Mogła zmienić adres po końcu krótkiej serii albo w linku jest literówka. Wróć na główny szlak i zacznij od nowości.</p>
  <a class="btn" href="index.html">Wróć do sklepu</a>
</main>
</body>
</html>
